<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Made This On My Phone</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: sans-serif;
    }

    #starfield {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* NEDM CAT */
    #nedm-cat {
      position: fixed;
      width: 100px;
      height: 100px;
      z-index: 10;
      pointer-events: none;
    }

    @keyframes cat-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    #cat-body {
      width: 100%;
      height: 100%;
      animation: cat-spin 2s linear infinite;
    }

    /* DAVID DUCHOVNY */
    #duchovny-wrap {
      position: fixed;
      bottom: 0;
      right: 120px;
      height: 55vh;
      z-index: 5;
      pointer-events: none;
    }

    #duchovny {
      height: 100%;
      filter: drop-shadow(-4px 0 12px rgba(0,180,255,0.6));
    }

    #thought-bubble {
      position: absolute;
      top: 2%;
      right: 100%;
      margin-right: -10px;
      background: white;
      color: #222;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      font-size: clamp(10px, 1.4vw, 16px);
      font-weight: bold;
      padding: 10px 14px;
      border-radius: 50%;
      width: clamp(100px, 14vw, 160px);
      height: clamp(60px, 8vw, 100px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 0 0 3px #ddd;
      animation: thought-float 3s ease-in-out infinite;
    }

    /* thought bubble tail dots */
    #thought-bubble::after {
      content: '';
      position: absolute;
      bottom: -18px;
      right: 18px;
      width: 12px; height: 12px;
      background: white;
      border-radius: 50%;
      box-shadow: 10px 10px 0 6px white, 20px 20px 0 3px white;
    }

    /* SANTA SLEIGH */
    #santa-sleigh {
      position: fixed;
      top: 18vh;
      left: -520px;
      width: 500px;
      z-index: 4;
      pointer-events: none;
      filter: drop-shadow(0 0 6px rgba(255,200,100,0.5));
    }

    @keyframes rudolph-pulse {
      0%, 100% { filter: drop-shadow(0 0 6px #ff3300) drop-shadow(0 0 14px #ff6600); }
      50%       { filter: drop-shadow(0 0 12px #ff0000) drop-shadow(0 0 28px #ff4400); }
    }

    #rudolph-nose {
      animation: rudolph-pulse 0.8s ease-in-out infinite;
    }

    /* NEON TEXT */
    #neon-text {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-family: 'Courier New', monospace;
      font-size: clamp(16px, 3vw, 42px);
      font-weight: bold;
      letter-spacing: 0.08em;
      white-space: nowrap;
      color: #fff;
      text-shadow:
        0 0 5px #fff,
        0 0 10px #fff,
        0 0 20px #ff00de,
        0 0 40px #ff00de,
        0 0 80px #ff00de,
        0 0 90px #ff00de;
      animation: neon-flicker 4s infinite;
      pointer-events: none;
    }

    @keyframes neon-flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        text-shadow:
          0 0 5px #fff,
          0 0 10px #fff,
          0 0 20px #ff00de,
          0 0 40px #ff00de,
          0 0 80px #ff00de;
        opacity: 1;
      }
      20%, 24%, 55% {
        text-shadow: none;
        opacity: 0.6;
      }
    }

    /* LOFI GIRL */
    #lofi-girl {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 28vh;
      z-index: 6;
      pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(255, 180, 100, 0.4));
    }

    /* RAINY CITY LABS */
    #rainy-city {
      position: fixed;
      bottom: calc(28vh + 10px);
      left: 18px;
      z-index: 20;
      color: rgba(180, 220, 255, 0.7);
      font-family: 'Courier New', monospace;
      font-size: clamp(10px, 1.2vw, 14px);
      letter-spacing: 0.1em;
      text-shadow: 0 0 8px rgba(100, 180, 255, 0.8);
      pointer-events: none;
    }

    @keyframes thought-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    /* LASERS */
    .laser {
      position: fixed;
      height: 3px;
      background: linear-gradient(to right, red, orange, yellow);
      box-shadow: 0 0 6px 2px red;
      z-index: 9;
      pointer-events: none;
      transform-origin: left center;
      border-radius: 2px;
    }
  </style>
</head>

      <circle cx="18" cy="-4" r="7" fill="#8B4513"/>
      <line x1="-10" y1="9" x2="-12" y2="22" stroke="#8B4513" stroke-width="2.5"/>
      <line x1="-4"  y1="9" x2="-4"  y2="22" stroke="#8B4513" stroke-width="2.5"/>
      <line x1="4"   y1="9" x2="6"   y2="22" stroke="#8B4513" stroke-width="2.5"/>
      <line x1="10"  y1="9" x2="12"  y2="22" stroke="#8B4513" stroke-width="2.5"/>
      <line x1="16" y1="-10" x2="12" y2="-20" stroke="#6B3410" stroke-width="2"/>
      <line x1="12" y1="-20" x2="8"  y2="-26" stroke="#6B3410" stroke-width="1.5"/>
      <line x1="12" y1="-20" x2="16" y2="-26" stroke="#6B3410" stroke-width="1.5"/>
      <line x1="20" y1="-10" x2="24" y2="-20" stroke="#6B3410" stroke-width="2"/>
      <line x1="24" y1="-20" x2="20" y2="-26" stroke="#6B3410" stroke-width="1.5"/>
      <line x1="24" y1="-20" x2="28" y2="-26" stroke="#6B3410" stroke-width="1.5"/>
      <circle cx="24" cy="-4" r="2" fill="#1a0a00"/>
    </g>

    <!-- Rudolph (lead reindeer) -->
    <g transform="translate(300,14)">
      <ellipse cx="0" cy="0" rx="18" ry="9" fill="#8B4513"/>
      <circle cx="18" cy="-4" r="7" fill="#8B4513"/>
      <line x1="-10" y1="9" x2="-12" y2="22" stroke="#8B4513" stroke-width="2.5"/>

      <path d="M -5 54 Q 20 64 95 60" stroke="#a07840" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- NEON TEXT -->
  <div id="neon-text">I made this on my phone</div>

  <!-- LOFI GIRL -->
  <img id="lofi-girl" src="IMG_2214.png" alt="Lofi Girl">

  <!-- RAINY CITY LABS -->
  <div id="rainy-city">a rainy-city-labs project</div>

  <!-- DAVID DUCHOVNY -->
  <div id="duchovny-wrap">
    <div id="thought-bubble">I miss Scully</div>
    <img id="duchovny" src="IMG_2211.png" alt="David Duchovny">
  </div>

  <!-- NEDM CAT -->
  <div id="nedm-cat">
    <img id="cat-body" src="IMG_2209.png" alt="nedm cat" style="width:100%;height:100%;object-fit:contain;">
  </div>

  <script>
    // --- STARFIELD ---
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStars();
    });

    const NUM_STARS = 300;
    let stars = [];

    function initStars() {
      stars = [];
      for (let i = 0; i < NUM_STARS; i++) {
        stars.push({
          x: Math.random() * canvas.width - canvas.width / 2,
          y: Math.random() * canvas.height - canvas.height / 2,
          z: Math.random() * canvas.width,
          pz: 0
        });
      }
    }

    function drawStars() {
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const speed = 12;

      for (let star of stars) {
        star.pz = star.z;
        star.z -= speed;

        if (star.z <= 0) {
          star.x = Math.random() * canvas.width - cx;
          star.y = Math.random() * canvas.height - cy;
          star.z = canvas.width;
          star.pz = star.z;
        }

        const sx = (star.x / star.z) * canvas.width + cx;
        const sy = (star.y / star.z) * canvas.height + cy;
        const px = (star.x / star.pz) * canvas.width + cx;
        const py = (star.y / star.pz) * canvas.height + cy;

        const size = Math.max(0.5, (1 - star.z / canvas.width) * 3);
        const brightness = Math.floor((1 - star.z / canvas.width) * 255);
        const color = `rgb(${brightness},${brightness},255)`;

        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(sx, sy);
        ctx.strokeStyle = color;
        ctx.lineWidth = size;
        ctx.stroke();
      }
    }

    function loop() {
      drawStars();
      requestAnimationFrame(loop);
    }

    initStars();
    loop();

    // --- SANTA SLEIGH ---
    const sleigh = document.getElementById('santa-sleigh');
    let sleighX = -520;
    let sleighActive = false;

    function launchSleigh() {
      sleighX = -520;
      sleighActive = true;
      const yPos = 8 + Math.random() * 35;
      sleigh.style.top = yPos + 'vh';
    }

    function updateSleigh() {
      if (sleighActive) {
        sleighX += 3.5;
        sleigh.style.left = sleighX + 'px';
        if (sleighX > window.innerWidth + 100) {
          sleighActive = false;
          // fly again in 15–30 seconds
          setTimeout(launchSleigh, 15000 + Math.random() * 15000);
        }
      }
    }

    // first pass after 4 seconds
    setTimeout(launchSleigh, 4000);

    // --- NEDM CAT BOUNCE ---
    const cat = document.getElementById('nedm-cat');
    const CAT_SIZE = 100;
    let catX = Math.random() * (window.innerWidth  - CAT_SIZE);
    let catY = Math.random() * (window.innerHeight - CAT_SIZE);
    let catVX = (Math.random() > 0.5 ? 1 : -1) * (2.5 + Math.random() * 1.5);
    let catVY = (Math.random() > 0.5 ? 1 : -1) * (2.5 + Math.random() * 1.5);

    // Lasers
    const lasers = [];
    const MAX_LASERS = 6;

    function spawnLaser() {
      if (lasers.length >= MAX_LASERS) {
        const old = lasers.shift();
        old.el.remove();
      }

      // shoot from each eye (positions relative to cat center, tuned for photo)
      const eyeOffsets = [
        { dx: -14, dy: -6 },  // left eye
        { dx:  14, dy: -6 }   // right eye
      ];

      for (const eye of eyeOffsets) {
        const el = document.createElement('div');
        el.className = 'laser';
        document.body.appendChild(el);

        const startX = catX + CAT_SIZE / 2 + eye.dx;
        const startY = catY + CAT_SIZE / 2 + eye.dy;
        const angle  = Math.atan2(catVY, catVX) * (180 / Math.PI);
        const length = 80 + Math.random() * 60;

        el.style.left   = startX + 'px';
        el.style.top    = startY + 'px';
        el.style.width  = length + 'px';
        el.style.transform = `rotate(${angle}deg)`;

        lasers.push({ el, life: 18 });
      }

      // Flash the cat red briefly
      cat.style.filter = 'drop-shadow(0 0 8px red) brightness(1.4)';
      setTimeout(() => { cat.style.filter = ''; }, 80);
    }

    let laserTick = 0;
    function updateCat() {
      catX += catVX;
      catY += catVY;

      if (catX <= 0)                        { catX = 0;                          catVX = Math.abs(catVX); }
      if (catX >= window.innerWidth - CAT_SIZE)  { catX = window.innerWidth - CAT_SIZE;  catVX = -Math.abs(catVX); }
      if (catY <= 0)                        { catY = 0;                          catVY = Math.abs(catVY); }
      if (catY >= window.innerHeight - CAT_SIZE) { catY = window.innerHeight - CAT_SIZE; catVY = -Math.abs(catVY); }

      cat.style.left = catX + 'px';
      cat.style.top  = catY + 'px';

      // tick down laser lives
      for (let i = lasers.length - 1; i >= 0; i--) {
        lasers[i].life--;
        lasers[i].el.style.opacity = lasers[i].life / 18;
        if (lasers[i].life <= 0) {
          lasers[i].el.remove();
          lasers.splice(i, 1);
        }
      }

      laserTick++;
      if (laserTick % 40 === 0) spawnLaser();

      updateSleigh();

      requestAnimationFrame(updateCat);
    }
    updateCat();
  </script>

</body>
