<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Made This On My Phone</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Dancing+Script:wght@700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: sans-serif;
    }

    #starfield {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* NEDM CAT */
    #nedm-cat {
      position: fixed;
      width: 21vmin;
      height: 21vmin;
      z-index: 10;
      pointer-events: none;
      will-change: transform;
    }

    @keyframes cat-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    #cat-body {
      width: 100%;
      height: 100%;
      animation: cat-spin 2s linear infinite;
    }

    /* GIF CHARACTERS */
    #yelling-cat {
      position: fixed;
      bottom: 28vh;
      left: 50%;
      transform: translateX(-50%);
      height: 33vmin;
      z-index: 6;
      pointer-events: none;
      animation: yell-bounce 0.4s ease-in-out infinite alternate;
    }

    @keyframes yell-bounce {
      from { transform: translateX(-50%) scaleY(1); }
      to   { transform: translateX(-50%) scaleY(1.06); }
    }

    #judgy-cat {
      position: fixed;
      top: 16vh;
      right: 1vw;
      height: 33vmin;
      z-index: 6;
      pointer-events: none;
    }

    #tux {
      position: fixed;
      bottom: 0;
      right: 1vw;
      height: 39vmin;
      z-index: 6;
      pointer-events: none;
      animation: tux-sway 2.5s ease-in-out infinite;
    }

    @keyframes tux-sway {
      0%, 100% { transform: rotate(-3deg); }
      50%       { transform: rotate(3deg); }
    }

    /* DAVID DUCHOVNY */
    #duchovny-wrap {
      position: fixed;
      bottom: 0;
      left: 1vw;
      height: 85vmin;
      z-index: 5;
      pointer-events: none;
      overflow: visible;
    }

    #duchovny {
      height: 100%;
      width: auto;
      filter: drop-shadow(-2px 0 6px rgba(0,180,255,0.4));
    }

    #thought-bubble {
      position: fixed;
      bottom: 72vmin;
      left: 1vw;
      width: 24vmin;
      z-index: 5;
      animation: thought-float 3s ease-in-out infinite;
      overflow: visible;
    }

    /* UFO */
    #ufo {
      position: fixed;
      left: 0; top: 0;
      width: 24vmin;
      z-index: 8;
      pointer-events: none;
      display: none;
      will-change: transform;
    }

    @keyframes ufo-glow {
      0%, 100% { filter: drop-shadow(0 0 8px #00ff88); }
      50%       { filter: drop-shadow(0 0 14px #00ffaa); }
    }

    #ufo.active { display: block; animation: ufo-glow 1s ease-in-out infinite; }

    #ufo-beam {
      position: fixed;
      left: 0; top: 0;
      width: 6px;
      background: linear-gradient(to bottom, rgba(0,255,100,0.9), rgba(0,255,100,0));
      z-index: 7;
      pointer-events: none;
      display: none;
      border-radius: 3px;
      will-change: transform;
    }

    /* CANDY STAR */
    #candy-star {
      position: fixed;
      left: 0; top: 0;
      width: 15vmin;
      height: 15vmin;
      z-index: 11;
      pointer-events: none;
      display: none;
      will-change: transform;
    }
    #candy-star.active { display: block; }

    .star-trail {
      position: fixed;
      left: 0; top: 0;
      width: 3vmin;
      height: 3vmin;
      border-radius: 50%;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      will-change: transform, opacity;
    }

    /* NEON TEXT */

    #neon-text {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-family: 'Comic Sans MS', 'Comic Sans', cursive;
      font-size: clamp(18px, 4.5vw, 56px);
      font-weight: 400;
      letter-spacing: 0.05em;
      white-space: nowrap;
      max-width: 96vw;
      text-align: center;
      color: #fff;
      text-shadow:
        0 0 7px #fff,
        0 0 20px #fff,
        0 0 40px #ff00de,
        0 0 80px #ff00de,
        0 0 120px #ff00de,
        0 0 160px #ff40ef,
        0 0 220px #ff40ef;
      animation: neon-flicker 4s infinite;
      pointer-events: none;
    }

    @keyframes neon-flicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% {
        opacity: 1;
      }
      19%, 24%, 55% {
        opacity: 0.4;
      }
    }

    /* LOFI GIRL */
    #lofi-girl {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 45vmin;
      width: auto;
      z-index: 6;
      pointer-events: none;
      filter: drop-shadow(0 0 5px rgba(255, 180, 100, 0.3));
    }

    /* RAINY CITY LABS */
    #rainy-city {
      position: fixed;
      bottom: calc(45vmin + 6px);
      left: 1vw;
      z-index: 20;
      color: rgba(180, 220, 255, 0.7);
      font-family: 'Courier New', monospace;
      font-size: clamp(12px, 2.2vmin, 20px);
      letter-spacing: 0.1em;
      text-shadow: 0 0 8px rgba(100, 180, 255, 0.8);
      pointer-events: none;
    }

    @keyframes thought-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    /* LIU KANG */
    #liu-kang {
      position: fixed;
      left: 0; top: 0;
      height: 40vmin;
      z-index: 6;
      pointer-events: none;
      display: none;
      will-change: transform;
    }
    #liu-kang.active { display: block; }

    /* LASERS */
    .laser {
      position: fixed;
      left: 0; top: 0;
      height: 3px;
      background: linear-gradient(to right, red, orange, yellow);
      z-index: 12;
      pointer-events: none;
      transform-origin: left center;
      border-radius: 2px;
      will-change: transform, opacity;
    }
  </style>
</head>
<body>

  <!-- DAVID DUCHOVNY -->
  <div id="duchovny-wrap">

      <!-- connecting dots trailing to Mulder's head (right side) -->

      <!-- cloud bumps -->
      <circle cx="62"  cy="72" r="28" fill="white"/>

      <!-- bottom round -->
      <ellipse cx="115" cy="108" rx="65" ry="20" fill="white"/>
      <!-- text -->
      <text x="112" y="88"
        text-anchor="middle"

        font-family="'Comic Sans MS', 'Comic Sans', cursive"
        font-size="17"

        fill="#111">I miss Scully</text>

    <img id="duchovny" src="IMG_2211.png" alt="David Duchovny">

  <!-- NEDM CAT -->
  <div id="nedm-cat">
    <img id="cat-body" src="IMG_2209.png" alt="nedm cat" style="width:100%;height:100%;object-fit:contain;">
  </div>

  <script>
    // --- STARFIELD ---
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d', { alpha: false });

    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      imgData = ctx.createImageData(W, H);
      pixels = imgData.data;
      buf32 = new Uint32Array(imgData.data.buffer);
      initStars();
    });

    const NUM_STARS = 300;
    // Flat typed arrays for star data: x, y, z, pz per star
    const starX_ = new Float32Array(NUM_STARS);
    const starY_ = new Float32Array(NUM_STARS);
    const starZ_ = new Float32Array(NUM_STARS);
    const starPZ = new Float32Array(NUM_STARS);

    function initStars() {
      const hw = W / 2, hh = H / 2;
      for (let i = 0; i < NUM_STARS; i++) {
        starX_[i] = Math.random() * W - hw;
        starY_[i] = Math.random() * H - hh;
        starZ_[i] = Math.random() * W;
        starPZ[i] = 0;
      }
    }

    // Pre-create ImageData for pixel-level starfield (much faster than 300 stroke calls)
    let imgData = ctx.createImageData(W, H);
    let pixels = imgData.data;
    let buf32 = new Uint32Array(imgData.data.buffer);

    function drawStars() {
      // Fade existing pixels using 32-bit ops (4x fewer iterations)
      const len32 = buf32.length;
      for (let j = 0; j < len32; j++) {
        const v = buf32[j];
        // Extract RGBA channels, multiply by ~0.82 (210/256), reassemble
        // Layout is ABGR on little-endian
        const r = ((v & 0xFF) * 210) >>> 8;
        const g = (((v >>> 8) & 0xFF) * 210) >>> 8;
        const b = (((v >>> 16) & 0xFF) * 210) >>> 8;
        buf32[j] = 0xFF000000 | (b << 16) | (g << 8) | r;
      }

      const cx = W * 0.5, cy = H * 0.5;
      const speed = 12;
      const invW = 1 / W;

      for (let i = 0; i < NUM_STARS; i++) {
        starPZ[i] = starZ_[i];
        starZ_[i] -= speed;

        if (starZ_[i] <= 0) {
          starX_[i] = Math.random() * W - cx;
          starY_[i] = Math.random() * H - cy;
          starZ_[i] = W;
          starPZ[i] = starZ_[i];
        }

        const invZ = 1 / starZ_[i];
        const sx = (starX_[i] * invZ * W + cx) | 0;
        const sy = (starY_[i] * invZ * H + cy) | 0;

        if (sx < 0 || sx >= W || sy < 0 || sy >= H) continue;

        const ratio = 1 - starZ_[i] * invW;
        const b = (ratio * 255) | 0;

        // Draw a pixel cluster (size based on distance)
        const size = (ratio * 2.5) | 0;
        const r = Math.max(size, 1);
        const color32 = 0xFF000000 | (0xFF << 16) | (b << 8) | b; // ABGR: alpha=FF, B=FF, G=b, R=b
        for (let dy = -r; dy <= r; dy++) {
          const py = sy + dy;
          if (py < 0 || py >= H) continue;
          const rowOff = py * W;
          for (let dx = -r; dx <= r; dx++) {
            const px = sx + dx;
            if (px < 0 || px >= W) continue;
            buf32[rowOff + px] = color32;
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);
    }

    initStars();

    // --- UFO ---
    const ufo      = document.getElementById('ufo');
    const ufoBeam  = document.getElementById('ufo-beam');
    const UFO_W    = 120;
    const UFO_H    = 60;
    let ufoX = -200, ufoY = -200;
    let ufoState   = 'idle';
    let ufoShootFrames = 0;

    function startUFO() {
      const side = Math.floor(Math.random() * 4);
      if (side === 0)      { ufoX = Math.random() * W;  ufoY = -UFO_H; }
      else if (side === 1) { ufoX = W;                   ufoY = Math.random() * H * 0.6; }
      else if (side === 2) { ufoX = Math.random() * W;  ufoY = -UFO_H; }
      else                 { ufoX = -UFO_W;              ufoY = Math.random() * H * 0.6; }

      ufoState = 'approach';
      ufo.classList.add('active');
    }

    function updateUFO() {
      if (ufoState === 'idle') return;

      const catCX = catX + CAT_SIZE * 0.5;
      const catCY = catY + CAT_SIZE * 0.5;
      const ufoCX = ufoX + UFO_W * 0.5;
      const ufoCY = ufoY + UFO_H * 0.5;
      const dx = catCX - ufoCX;
      const dy = catCY - ufoCY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (ufoState === 'approach') {
        const speed = 2.8;
        const invDist = 1 / dist;
        ufoX += dx * invDist * speed;
        ufoY += dy * invDist * speed;
        ufo.style.transform = `translate3d(${ufoX}px,${ufoY}px,0)`;

        if (dist < 220) {
          ufoState = 'shoot';
          ufoShootFrames = 90;
        }
      }

      else if (ufoState === 'shoot') {
        ufoBeam.style.display = 'block';
        const beamX = ufoCX - 3;
        const beamY = ufoY + UFO_H - 4;
        const beamH = Math.max(0, catCY - beamY);
        ufoBeam.style.transform = `translate3d(${beamX}px,${beamY}px,0)`;
        ufoBeam.style.height = beamH + 'px';
        ufoX += (Math.random() - 0.5) * 1.5;
        ufoY += (Math.random() - 0.5) * 1.5;
        ufo.style.transform = `translate3d(${ufoX}px,${ufoY}px,0)`;

        if (--ufoShootFrames <= 0) {
          ufoBeam.style.display = 'none';
          ufoState = 'flee';
        }
      }

      else if (ufoState === 'flee') {
        ufoX -= 8;
        ufoY -= 5;
        ufo.style.transform = `translate3d(${ufoX}px,${ufoY}px,0)`;

        if (ufoX < -300 || ufoY < -300) {
          ufoState = 'idle';
          ufo.classList.remove('active');
          ufoBeam.style.display = 'none';
          setTimeout(startUFO, 20000 + Math.random() * 25000);
        }
      }
    }

    setTimeout(startUFO, 8000);

    // --- CANDY STAR ---
    const candyStar = document.getElementById('candy-star');
    function getStarSize() { return Math.min(window.innerWidth, window.innerHeight) * 0.15; }
    const RAINBOW = ['#ff0000','#ff7700','#ffee00','#00cc44','#0088ff','#8800ff','#ff00cc'];
    let starX, starY, starVX, starVY, starActive = false;
    const trailPool = [];
    const TRAIL_COUNT = 10;

    for (let i = 0; i < TRAIL_COUNT; i++) {
      const el = document.createElement('div');
      el.className = 'star-trail';
      document.body.appendChild(el);
      trailPool.push({ el, x: -999, y: -999, life: 0, maxLife: 0 });
    }

    let trailIdx = 0;

    function launchStar() {
      starX  = -getStarSize() - 10;
      starY  = (10 + Math.random() * 70) / 100 * H;
      starVX = 5 + Math.random() * 4;
      starVY = (Math.random() - 0.5) * 2;
      starActive = true;
      candyStar.classList.add('active');
    }

    let starSpinAngle = 0;

    function updateStar() {
      if (!starActive) return;

      starX += starVX;
      starY += starVY;
      starSpinAngle += 4;

      candyStar.style.transform = `translate3d(${starX}px,${starY}px,0) rotate(${starSpinAngle}deg)`;

      // spawn trail bubble
      const t = trailPool[trailIdx % TRAIL_COUNT];
      trailIdx++;
      const ss = getStarSize();
      const trailR = Math.min(W, H) * 0.015;
      t.x       = starX + ss * 0.5 - trailR;
      t.y       = starY + ss * 0.5 - trailR;
      t.life    = 30;
      t.maxLife = 30;
      const color = RAINBOW[trailIdx % RAINBOW.length];
      t.el.style.background = color;

      // fade all trail bubbles
      for (let j = 0; j < TRAIL_COUNT; j++) {
        const tr = trailPool[j];
        if (tr.life > 0) {
          tr.life--;
          const frac = tr.life / tr.maxLife;
          tr.el.style.transform = `translate3d(${tr.x}px,${tr.y}px,0) scale(${0.4 + frac * 0.8})`;
          tr.el.style.opacity = frac;
        } else {
          tr.el.style.opacity = 0;
        }
      }

      if (starX > W + 100) {
        starActive = false;
        candyStar.classList.remove('active');
        for (let j = 0; j < TRAIL_COUNT; j++) {
          trailPool[j].life = 0;
          trailPool[j].el.style.opacity = 0;
        }
        setTimeout(launchStar, 12000 + Math.random() * 18000);
      }
    }

    setTimeout(launchStar, 12000);

    // --- LIU KANG BICYCLE KICK ---
    const liuKang = document.getElementById('liu-kang');
    let lkX, lkY, lkActive = false;

    function launchLiuKang() {
      lkX = -400;
      lkY = Math.random() * (H / 3);
      lkActive = true;
      liuKang.classList.add('active');
    }

    function updateLiuKang() {
      if (!lkActive) return;
      lkX += 3 + Math.random() * 1;
      lkY += Math.sin(lkX * 0.02) * 1.5;
      liuKang.style.transform = `translate3d(${lkX}px,${lkY}px,0) scaleX(-1)`;

      if (lkX > W + 100) {
        lkActive = false;
        liuKang.classList.remove('active');
        setTimeout(launchLiuKang, 18750 + Math.random() * 11250);
      }
    }

    setTimeout(launchLiuKang, 11250);

    // --- NEDM CAT BOUNCE ---
    const cat = document.getElementById('nedm-cat');
    const CAT_SIZE = Math.min(W, H) * 0.21;
    let catX = Math.random() * (W - CAT_SIZE);
    let catY = Math.random() * (H - CAT_SIZE);
    let catVX = (Math.random() > 0.5 ? 1 : -1) * (2.5 + Math.random() * 1.5);
    let catVY = (Math.random() > 0.5 ? 1 : -1) * (2.5 + Math.random() * 1.5);

    // Laser pool — pre-create DOM elements, reuse them
    const MAX_LASER_POOL = 12;  // 6 pairs max
    const laserPool = [];
    for (let i = 0; i < MAX_LASER_POOL; i++) {
      const el = document.createElement('div');
      el.className = 'laser';
      el.style.display = 'none';
      document.body.appendChild(el);
      laserPool.push({ el, life: 0, active: false, targetX: 0, targetY: 0, eyeDx: 0, eyeDy: 0 });
    }
    let laserPoolIdx = 0;

    const eyeOffsets = [{ dx: -14, dy: -6 }, { dx: 14, dy: -6 }];

    // Get positions of targetable scene objects
    function getSceneTargets() {
      const targets = [];
      const yc = document.getElementById('yelling-cat');
      if (yc) { const r = yc.getBoundingClientRect(); targets.push({ x: r.left + r.width / 2, y: r.top + r.height / 2 }); }
      const jc = document.getElementById('judgy-cat');
      if (jc) { const r = jc.getBoundingClientRect(); targets.push({ x: r.left + r.width / 2, y: r.top + r.height / 2 }); }
      const tx = document.getElementById('tux');
      if (tx) { const r = tx.getBoundingClientRect(); targets.push({ x: r.left + r.width / 2, y: r.top + r.height / 2 }); }
      const lf = document.getElementById('lofi-girl');
      if (lf) { const r = lf.getBoundingClientRect(); targets.push({ x: r.left + r.width / 2, y: r.top + r.height / 2 }); }
      const dw = document.getElementById('duchovny-wrap');
      if (dw) { const r = dw.getBoundingClientRect(); targets.push({ x: r.left + r.width / 2, y: r.top + r.height / 3 }); }
      // Liu Kang only if active on screen
      if (lkActive) { const r = liuKang.getBoundingClientRect(); targets.push({ x: r.left + r.width / 2, y: r.top + r.height / 2 }); }
      return targets;
    }

    function getLaserTarget() {
      // Exclusively target UFO when it's active
      if (ufoState !== 'idle') {
        return { x: ufoX + UFO_W * 0.5, y: ufoY + UFO_H * 0.5 };
      }
      // Otherwise pick a random scene object
      const targets = getSceneTargets();
      if (targets.length === 0) return { x: catX + CAT_SIZE * 0.5 + catVX * 50, y: catY + CAT_SIZE * 0.5 + catVY * 50 };
      return targets[Math.floor(Math.random() * targets.length)];
    }

    function spawnLaser() {
      const target = getLaserTarget();

      for (const eye of eyeOffsets) {
        const laser = laserPool[laserPoolIdx % MAX_LASER_POOL];
        laserPoolIdx++;

        laser.eyeDx = eye.dx;
        laser.eyeDy = eye.dy;
        laser.targetX = target.x;
        laser.targetY = target.y;

        const startX = catX + CAT_SIZE * 0.5 + eye.dx;
        const startY = catY + CAT_SIZE * 0.5 + eye.dy;
        const dx = target.x - startX;
        const dy = target.y - startY;
        const angle = Math.atan2(dy, dx) * (180 / Math.PI);
        const length = Math.min(Math.sqrt(dx * dx + dy * dy), 300);

        laser.el.style.width   = length + 'px';
        laser.el.style.transform = `translate3d(${startX}px,${startY}px,0) rotate(${angle}deg)`;
        laser.el.style.opacity = 1;
        laser.el.style.display = 'block';
        laser.life = 18;
        laser.active = true;
      }

      cat.style.filter = 'drop-shadow(0 0 8px red) brightness(1.4)';
      setTimeout(() => { cat.style.filter = ''; }, 80);
    }

    let laserTick = 0;

    // --- SINGLE ANIMATION LOOP ---
    function tick() {
      // Starfield
      drawStars();

      // Cat bounce
      catX += catVX;
      catY += catVY;

      const maxX = W - CAT_SIZE;
      const maxY = H - CAT_SIZE;
      if (catX <= 0)    { catX = 0;    catVX = Math.abs(catVX); }
      if (catX >= maxX) { catX = maxX; catVX = -Math.abs(catVX); }
      if (catY <= 0)    { catY = 0;    catVY = Math.abs(catVY); }
      if (catY >= maxY) { catY = maxY; catVY = -Math.abs(catVY); }

      cat.style.transform = `translate3d(${catX}px,${catY}px,0)`;

      // Lasers — update position to track with cat, fade out
      for (let i = 0; i < MAX_LASER_POOL; i++) {
        const laser = laserPool[i];
        if (!laser.active) continue;
        laser.life--;
        if (laser.life <= 0) {
          laser.active = false;
          laser.el.style.display = 'none';
        } else {
          const sx = catX + CAT_SIZE * 0.5 + laser.eyeDx;
          const sy = catY + CAT_SIZE * 0.5 + laser.eyeDy;
          const dx = laser.targetX - sx;
          const dy = laser.targetY - sy;
          const angle = Math.atan2(dy, dx) * (180 / Math.PI);
          const length = Math.min(Math.sqrt(dx * dx + dy * dy), 300);
          laser.el.style.width = length + 'px';
          laser.el.style.transform = `translate3d(${sx}px,${sy}px,0) rotate(${angle}deg)`;
          laser.el.style.opacity = laser.life / 18;
        }
      }

      laserTick++;
      if (laserTick % 40 === 0) spawnLaser();

      // UFO, Star & Liu Kang
      updateUFO();
      updateStar();
      updateLiuKang();

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>

</body>
