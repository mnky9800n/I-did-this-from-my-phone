<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Made This On My Phone</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: sans-serif;
    }

    #starfield {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* NEDM CAT */
    #nedm-cat {
      position: fixed;
      width: 100px;
      height: 100px;
      z-index: 10;
      pointer-events: none;
    }

    @keyframes cat-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    #cat-body {
      width: 100%;
      height: 100%;
      animation: cat-spin 2s linear infinite;
    }

    /* LASERS */
    .laser {
      position: fixed;
      height: 3px;
      background: linear-gradient(to right, red, orange, yellow);
      box-shadow: 0 0 6px 2px red;
      z-index: 9;
      pointer-events: none;
      transform-origin: left center;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <canvas id="starfield"></canvas>

  <!-- NEDM CAT -->
  <div id="nedm-cat">
    <svg id="cat-body" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <!-- ears -->
      <polygon points="15,35 5,10 30,28" fill="#e8a87c"/>
      <polygon points="85,35 95,10 70,28" fill="#e8a87c"/>
      <polygon points="15,35 10,15 27,30" fill="#f7c5a0"/>
      <polygon points="85,35 90,15 73,30" fill="#f7c5a0"/>
      <!-- head -->
      <ellipse cx="50" cy="55" rx="38" ry="35" fill="#e8a87c"/>
      <!-- face markings -->
      <ellipse cx="50" cy="55" rx="26" ry="22" fill="#f7c5a0"/>
      <!-- eyes -->
      <ellipse cx="36" cy="50" rx="7" ry="7" fill="white"/>
      <ellipse cx="64" cy="50" rx="7" ry="7" fill="white"/>
      <circle cx="37" cy="50" r="4" fill="#111"/>
      <circle cx="65" cy="50" r="4" fill="#111"/>
      <circle cx="38" cy="48" r="1.5" fill="white"/>
      <circle cx="66" cy="48" r="1.5" fill="white"/>
      <!-- pupils glow red when shooting -->
      <circle id="laser-glow-l" cx="37" cy="50" r="3" fill="red" opacity="0"/>
      <circle id="laser-glow-r" cx="65" cy="50" r="3" fill="red" opacity="0"/>
      <!-- nose -->
      <polygon points="50,60 46,65 54,65" fill="#e57"/>
      <!-- mouth -->
      <path d="M 44 67 Q 50 72 56 67" stroke="#c45" stroke-width="1.5" fill="none"/>
      <!-- whiskers left -->
      <line x1="12" y1="58" x2="38" y2="62" stroke="#888" stroke-width="1"/>
      <line x1="12" y1="64" x2="38" y2="65" stroke="#888" stroke-width="1"/>
      <!-- whiskers right -->
      <line x1="88" y1="58" x2="62" y2="62" stroke="#888" stroke-width="1"/>
      <line x1="88" y1="64" x2="62" y2="65" stroke="#888" stroke-width="1"/>
      <!-- stripes -->
      <line x1="30" y1="32" x2="25" y2="22" stroke="#d4956a" stroke-width="2"/>
      <line x1="50" y1="28" x2="50" y2="18" stroke="#d4956a" stroke-width="2"/>
      <line x1="70" y1="32" x2="75" y2="22" stroke="#d4956a" stroke-width="2"/>
    </svg>
  </div>

  <script>
    // --- STARFIELD ---
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStars();
    });

    const NUM_STARS = 300;
    let stars = [];

    function initStars() {
      stars = [];
      for (let i = 0; i < NUM_STARS; i++) {
        stars.push({
          x: Math.random() * canvas.width - canvas.width / 2,
          y: Math.random() * canvas.height - canvas.height / 2,
          z: Math.random() * canvas.width,
          pz: 0
        });
      }
    }

    function drawStars() {
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const speed = 12;

      for (let star of stars) {
        star.pz = star.z;
        star.z -= speed;

        if (star.z <= 0) {
          star.x = Math.random() * canvas.width - cx;
          star.y = Math.random() * canvas.height - cy;
          star.z = canvas.width;
          star.pz = star.z;
        }

        const sx = (star.x / star.z) * canvas.width + cx;
        const sy = (star.y / star.z) * canvas.height + cy;
        const px = (star.x / star.pz) * canvas.width + cx;
        const py = (star.y / star.pz) * canvas.height + cy;

        const size = Math.max(0.5, (1 - star.z / canvas.width) * 3);
        const brightness = Math.floor((1 - star.z / canvas.width) * 255);
        const color = `rgb(${brightness},${brightness},255)`;

        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(sx, sy);
        ctx.strokeStyle = color;
        ctx.lineWidth = size;
        ctx.stroke();
      }
    }

    function loop() {
      drawStars();
      requestAnimationFrame(loop);
    }

    initStars();
    loop();

    // --- NEDM CAT BOUNCE ---
    const cat = document.getElementById('nedm-cat');
    const CAT_SIZE = 100;
    let catX = Math.random() * (window.innerWidth  - CAT_SIZE);
    let catY = Math.random() * (window.innerHeight - CAT_SIZE);
    let catVX = (Math.random() > 0.5 ? 1 : -1) * (2.5 + Math.random() * 1.5);
    let catVY = (Math.random() > 0.5 ? 1 : -1) * (2.5 + Math.random() * 1.5);

    // Lasers
    const lasers = [];
    const MAX_LASERS = 6;

    function spawnLaser() {
      if (lasers.length >= MAX_LASERS) {
        const old = lasers.shift();
        old.el.remove();
      }

      // shoot from each eye
      const eyeOffsets = [
        { dx: 37 - 50, dy: 50 - 50 },  // left eye relative to cat center
        { dx: 65 - 50, dy: 50 - 50 }   // right eye relative to cat center
      ];

      for (const eye of eyeOffsets) {
        const el = document.createElement('div');
        el.className = 'laser';
        document.body.appendChild(el);

        const startX = catX + CAT_SIZE / 2 + eye.dx;
        const startY = catY + CAT_SIZE / 2 + eye.dy;
        const angle  = Math.atan2(catVY, catVX) * (180 / Math.PI);
        const length = 80 + Math.random() * 60;

        el.style.left   = startX + 'px';
        el.style.top    = startY + 'px';
        el.style.width  = length + 'px';
        el.style.transform = `rotate(${angle}deg)`;

        lasers.push({ el, life: 18 });
      }

      // Flash pupils
      document.getElementById('laser-glow-l').setAttribute('opacity', '0.9');
      document.getElementById('laser-glow-r').setAttribute('opacity', '0.9');
      setTimeout(() => {
        document.getElementById('laser-glow-l').setAttribute('opacity', '0');
        document.getElementById('laser-glow-r').setAttribute('opacity', '0');
      }, 80);
    }

    let laserTick = 0;
    function updateCat() {
      catX += catVX;
      catY += catVY;

      if (catX <= 0)                        { catX = 0;                          catVX = Math.abs(catVX); }
      if (catX >= window.innerWidth - CAT_SIZE)  { catX = window.innerWidth - CAT_SIZE;  catVX = -Math.abs(catVX); }
      if (catY <= 0)                        { catY = 0;                          catVY = Math.abs(catVY); }
      if (catY >= window.innerHeight - CAT_SIZE) { catY = window.innerHeight - CAT_SIZE; catVY = -Math.abs(catVY); }

      cat.style.left = catX + 'px';
      cat.style.top  = catY + 'px';

      // tick down laser lives
      for (let i = lasers.length - 1; i >= 0; i--) {
        lasers[i].life--;
        lasers[i].el.style.opacity = lasers[i].life / 18;
        if (lasers[i].life <= 0) {
          lasers[i].el.remove();
          lasers.splice(i, 1);
        }
      }

      laserTick++;
      if (laserTick % 40 === 0) spawnLaser();

      requestAnimationFrame(updateCat);
    }
    updateCat();
  </script>

</body>
</html>
