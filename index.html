<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Made This On My Phone</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: sans-serif;
    }

    #starfield {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* NEDM CAT */
    #nedm-cat {
      position: fixed;
      width: 100px;
      height: 100px;
      z-index: 10;
      pointer-events: none;
    }

    @keyframes cat-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    #cat-body {
      width: 100%;
      height: 100%;
      animation: cat-spin 2s linear infinite;
    }

    /* GIF CHARACTERS */
    #yelling-cat {
      position: fixed;
      bottom: 38vh;
      left: 50%;
      transform: translateX(-50%);
      height: clamp(80px, 14vh, 160px);
      z-index: 6;
      pointer-events: none;
      filter: drop-shadow(0 0 8px rgba(255,100,100,0.5));
      animation: yell-bounce 0.4s ease-in-out infinite alternate;
    }

    @keyframes yell-bounce {
      from { transform: translateX(-50%) scaleY(1); }
      to   { transform: translateX(-50%) scaleY(1.06); }
    }

    #judgy-cat {
      position: fixed;
      top: 28vh;
      right: 18px;
      height: clamp(80px, 13vh, 140px);
      z-index: 6;
      pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(80,80,255,0.4));
    }

    #tux {
      position: fixed;
      bottom: 0;
      right: 0;
      height: clamp(80px, 16vh, 180px);
      z-index: 6;
      pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(255,50,50,0.5));
      animation: tux-sway 2.5s ease-in-out infinite;
    }

    @keyframes tux-sway {
      0%, 100% { transform: rotate(-3deg); }
      50%       { transform: rotate(3deg); }
    }

    /* DAVID DUCHOVNY */
    #duchovny-wrap {
      position: fixed;
      bottom: 0;
      right: 120px;
      height: 55vh;
      z-index: 5;
      pointer-events: none;
    }

    #duchovny {
      height: 100%;
      filter: drop-shadow(-4px 0 12px rgba(0,180,255,0.6));
    }

    #thought-bubble {
      position: absolute;
      top: 2%;
      right: 100%;
      margin-right: -10px;
      background: white;
      color: #222;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      font-size: clamp(10px, 1.4vw, 16px);
      font-weight: bold;
      padding: 10px 14px;
      border-radius: 50%;
      width: clamp(100px, 14vw, 160px);
      height: clamp(60px, 8vw, 100px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 0 0 3px #ddd;
      animation: thought-float 3s ease-in-out infinite;
    }

    /* thought bubble tail dots */
    #thought-bubble::after {
      content: '';
      position: absolute;
      bottom: -18px;
      right: 18px;
      width: 12px; height: 12px;
      background: white;
      border-radius: 50%;
      box-shadow: 10px 10px 0 6px white, 20px 20px 0 3px white;
    }

    /* UFO */
    #ufo {
      position: fixed;
      width: 120px;
      z-index: 8;
      pointer-events: none;
      display: none;
    }

    @keyframes ufo-glow {
      0%, 100% { filter: drop-shadow(0 0 8px #00ff88) drop-shadow(0 0 20px #00cc66); }
      50%       { filter: drop-shadow(0 0 16px #00ffaa) drop-shadow(0 0 40px #00ff88); }
    }

    #ufo.active { display: block; animation: ufo-glow 1s ease-in-out infinite; }

    #ufo-beam {
      position: fixed;
      width: 6px;
      background: linear-gradient(to bottom, rgba(0,255,100,0.9), rgba(0,255,100,0));
      z-index: 7;
      pointer-events: none;
      display: none;
      border-radius: 3px;
      box-shadow: 0 0 10px 3px rgba(0,255,100,0.6);
    }

    /* CANDY STAR */
    #candy-star {
      position: fixed;
      width: 70px;
      height: 70px;
      z-index: 11;
      pointer-events: none;
      display: none;
    }
    #candy-star.active { display: block; }

    .star-trail {
      position: fixed;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
    }

    /* SANTA SLEIGH */
    #santa-sleigh {
      position: fixed;
      z-index: 4;
      pointer-events: none;
      filter: drop-shadow(0 0 6px rgba(255,200,100,0.4));
      transform: scaleX(-1);
    }

    /* NEON TEXT */
    @import url('https://fonts.googleapis.com/css2?family=Bungee&display=swap');

    #neon-text {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-family: 'Bungee', 'Arial Black', sans-serif;
      font-size: clamp(22px, 5vw, 68px);
      font-weight: 900;
      letter-spacing: 0.12em;
      white-space: nowrap;
      color: #fff;
      text-shadow:
        0 0 4px #fff,
        0 0 10px #fff,
        0 0 18px #fff,
        0 0 38px #ff00de,
        0 0 70px #ff00de,
        0 0 100px #ff00de,
        0 0 140px #ff00de;
      animation: neon-flicker 4s infinite;
      pointer-events: none;
      -webkit-text-stroke: 1px rgba(255,0,222,0.4);
    }

    @keyframes neon-flicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% {
        text-shadow:
          0 0 4px #fff,
          0 0 10px #fff,
          0 0 18px #fff,
          0 0 38px #ff00de,
          0 0 70px #ff00de,
          0 0 100px #ff00de,
          0 0 140px #ff00de;
        opacity: 1;
      }
      19%, 24%, 55% {
        text-shadow: none;
        opacity: 0.5;
      }
    }

    /* LOFI GIRL */
    #lofi-girl {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 28vh;
      z-index: 6;
      pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(255, 180, 100, 0.4));
    }

    /* RAINY CITY LABS */
    #rainy-city {
      position: fixed;
      bottom: calc(28vh + 10px);
      left: 18px;
      z-index: 20;
      color: rgba(180, 220, 255, 0.7);
      font-family: 'Courier New', monospace;
      font-size: clamp(10px, 1.2vw, 14px);
      letter-spacing: 0.1em;
      text-shadow: 0 0 8px rgba(100, 180, 255, 0.8);
      pointer-events: none;
    }

    @keyframes thought-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    /* LASERS */
    .laser {
      position: fixed;
      height: 3px;
      background: linear-gradient(to right, red, orange, yellow);
      box-shadow: 0 0 6px 2px red;
      z-index: 9;
      pointer-events: none;
      transform-origin: left center;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <canvas id="starfield"></canvas>

  <!-- CANDY STAR -->
  <svg id="candy-star" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- glow -->
    <circle cx="50" cy="50" r="38" fill="rgba(255,240,50,0.18)"/>
    <!-- star shape -->
    <polygon points="50,5 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35"
      fill="#ffe033" stroke="#ffaa00" stroke-width="2"/>
    <!-- candy stripes -->
    <polygon points="50,5 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35"
      fill="url(#candy-stripe)" opacity="0.55"/>
    <defs>
      <pattern id="candy-stripe" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
        <rect width="6" height="12" fill="#ff6ec7"/>
      </pattern>
    </defs>
    <!-- shine -->
    <ellipse cx="38" cy="32" rx="9" ry="5" fill="rgba(255,255,255,0.5)" transform="rotate(-20,38,32)"/>
  </svg>

  <!-- UFO -->
  <div id="ufo-beam"></div>
  <svg id="ufo" viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
    <!-- saucer shadow/bottom -->
    <ellipse cx="60" cy="42" rx="52" ry="10" fill="#1a2a1a" opacity="0.5"/>
    <!-- main disc -->
    <ellipse cx="60" cy="38" rx="52" ry="12" fill="#445544"/>
    <ellipse cx="60" cy="36" rx="52" ry="12" fill="#556655"/>
    <!-- rim lights -->
    <circle cx="20" cy="36" r="4" fill="#00ff88" opacity="0.9"/>
    <circle cx="36" cy="40" r="4" fill="#ffee00" opacity="0.9"/>
    <circle cx="52" cy="42" r="4" fill="#00ff88" opacity="0.9"/>
    <circle cx="68" cy="42" r="4" fill="#ffee00" opacity="0.9"/>
    <circle cx="84" cy="40" r="4" fill="#00ff88" opacity="0.9"/>
    <circle cx="100" cy="36" r="4" fill="#ffee00" opacity="0.9"/>
    <!-- dome -->
    <ellipse cx="60" cy="28" rx="28" ry="18" fill="#334433"/>
    <ellipse cx="60" cy="26" rx="26" ry="16" fill="#2a5c3a"/>
    <!-- dome highlight -->
    <ellipse cx="52" cy="20" rx="10" ry="6" fill="rgba(100,255,150,0.25)"/>
    <!-- alien inside dome -->
    <circle cx="60" cy="24" r="8" fill="#88cc44"/>
    <circle cx="57" cy="21" r="2" fill="#000"/>
    <circle cx="63" cy="21" r="2" fill="#000"/>
    <path d="M 56 27 Q 60 30 64 27" stroke="#000" stroke-width="1" fill="none"/>
  </svg>

  <!-- SANTA SLEIGH -->
  <img id="santa-sleigh" src="IMG_2218.gif" alt="Santa sleigh">

  <!-- NEON TEXT -->
  <div id="neon-text">I made this on my phone</div>

  <!-- GIF CHARACTERS -->
  <img id="yelling-cat" src="IMG_2215.gif" alt="yelling cat">
  <img id="judgy-cat"   src="IMG_2216.gif" alt="judgy black cat">
  <img id="tux"         src="IMG_2217.gif" alt="Tux">

  <!-- LOFI GIRL -->
  <img id="lofi-girl" src="IMG_2214.png" alt="Lofi Girl">

  <!-- RAINY CITY LABS -->
  <div id="rainy-city">a rainy-city-labs project</div>

  <!-- DAVID DUCHOVNY -->
  <div id="duchovny-wrap">
    <div id="thought-bubble">I miss Scully</div>
    <img id="duchovny" src="IMG_2211.png" alt="David Duchovny">
  </div>

  <!-- NEDM CAT -->
  <div id="nedm-cat">
    <img id="cat-body" src="IMG_2209.png" alt="nedm cat" style="width:100%;height:100%;object-fit:contain;">
  </div>

  <script>
    // --- STARFIELD ---
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStars();
    });

    const NUM_STARS = 300;
    let stars = [];

    function initStars() {
      stars = [];
      for (let i = 0; i < NUM_STARS; i++) {
        stars.push({
          x: Math.random() * canvas.width - canvas.width / 2,
          y: Math.random() * canvas.height - canvas.height / 2,
          z: Math.random() * canvas.width,
          pz: 0
        });
      }
    }

    function drawStars() {
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const speed = 12;

      for (let star of stars) {
        star.pz = star.z;
        star.z -= speed;

        if (star.z <= 0) {
          star.x = Math.random() * canvas.width - cx;
          star.y = Math.random() * canvas.height - cy;
          star.z = canvas.width;
          star.pz = star.z;
        }

        const sx = (star.x / star.z) * canvas.width + cx;
        const sy = (star.y / star.z) * canvas.height + cy;
        const px = (star.x / star.pz) * canvas.width + cx;
        const py = (star.y / star.pz) * canvas.height + cy;

        const size = Math.max(0.5, (1 - star.z / canvas.width) * 3);
        const brightness = Math.floor((1 - star.z / canvas.width) * 255);
        const color = `rgb(${brightness},${brightness},255)`;

        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(sx, sy);
        ctx.strokeStyle = color;
        ctx.lineWidth = size;
        ctx.stroke();
      }
    }

    function loop() {
      drawStars();
      requestAnimationFrame(loop);
    }

    initStars();
    loop();

    // --- SANTA SLEIGH ---
    const sleigh = document.getElementById('santa-sleigh');
    let sleighX = 0;
    let sleighW = 400;
    let sleighSpeed = 3.5;
    let sleighActive = false;

    function launchSleigh() {
      // randomise size: small (far), medium, large (close)
      sleighW = 180 + Math.random() * 480; // 180–660px
      sleighSpeed = 2 + (sleighW / 660) * 4; // faster when bigger/closer
      sleigh.style.width = sleighW + 'px';

      // start off the right edge
      sleighX = window.innerWidth + 20;
      sleighActive = true;

      const yPos = 5 + Math.random() * 40;
      sleigh.style.top = yPos + 'vh';
      sleigh.style.left = sleighX + 'px';
    }

    function updateSleigh() {
      if (sleighActive) {
        sleighX -= sleighSpeed;
        sleigh.style.left = sleighX + 'px';
        if (sleighX < -(sleighW + 20)) {
          sleighActive = false;
          setTimeout(launchSleigh, 15000 + Math.random() * 15000);
        }
      }
    }

    // first pass after 4 seconds
    setTimeout(launchSleigh, 4000);

    // --- UFO ---
    const ufo      = document.getElementById('ufo');
    const ufoBeam  = document.getElementById('ufo-beam');
    const UFO_W    = 120;
    const UFO_H    = 60;
    let ufoX = -200, ufoY = -200;
    let ufoState   = 'idle'; // idle | approach | shoot | flee
    let ufoTimer   = 0;
    let ufoShootFrames = 0;

    function startUFO() {
      // spawn from a random edge
      const side = Math.floor(Math.random() * 4);
      if (side === 0) { ufoX = Math.random() * window.innerWidth;  ufoY = -UFO_H; }
      else if (side === 1) { ufoX = window.innerWidth;              ufoY = Math.random() * window.innerHeight * 0.6; }
      else if (side === 2) { ufoX = Math.random() * window.innerWidth;  ufoY = -UFO_H; }
      else                 { ufoX = -UFO_W;                         ufoY = Math.random() * window.innerHeight * 0.6; }

      ufoState = 'approach';
      ufo.classList.add('active');
    }

    function updateUFO() {
      if (ufoState === 'idle') return;

      const catCX = catX + CAT_SIZE / 2;
      const catCY = catY + CAT_SIZE / 2;
      const ufoCX = ufoX + UFO_W / 2;
      const ufoCY = ufoY + UFO_H / 2;
      const dx = catCX - ufoCX;
      const dy = catCY - ufoCY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (ufoState === 'approach') {
        // move toward cat
        const speed = 2.8;
        ufoX += (dx / dist) * speed;
        ufoY += (dy / dist) * speed;
        ufo.style.left = ufoX + 'px';
        ufo.style.top  = ufoY + 'px';

        // close enough to shoot
        if (dist < 220) {
          ufoState = 'shoot';
          ufoShootFrames = 90;
        }
      }

      else if (ufoState === 'shoot') {
        // hover in place, show beam
        ufoBeam.style.display = 'block';
        const beamX = ufoCX - 3;
        const beamY = ufoY + UFO_H - 4;
        const beamH = Math.max(0, catCY - beamY);
        ufoBeam.style.left   = beamX + 'px';
        ufoBeam.style.top    = beamY + 'px';
        ufoBeam.style.height = beamH + 'px';
        // wobble slightly
        ufoX += (Math.random() - 0.5) * 1.5;
        ufoY += (Math.random() - 0.5) * 1.5;
        ufo.style.left = ufoX + 'px';
        ufo.style.top  = ufoY + 'px';

        ufoShootFrames--;
        if (ufoShootFrames <= 0) {
          ufoBeam.style.display = 'none';
          ufoState = 'flee';
        }
      }

      else if (ufoState === 'flee') {
        // bolt off-screen fast
        ufoX -= 8;
        ufoY -= 5;
        ufo.style.left = ufoX + 'px';
        ufo.style.top  = ufoY + 'px';

        if (ufoX < -300 || ufoY < -300) {
          ufoState = 'idle';
          ufo.classList.remove('active');
          ufoBeam.style.display = 'none';
          // come back in 20–45 seconds
          setTimeout(startUFO, 20000 + Math.random() * 25000);
        }
      }
    }

    // first visit after 8 seconds
    setTimeout(startUFO, 8000);

    // --- CANDY STAR ---
    const candyStar = document.getElementById('candy-star');
    const STAR_SIZE = 70;
    const RAINBOW = ['#ff0000','#ff7700','#ffee00','#00cc44','#0088ff','#8800ff','#ff00cc'];
    let starX, starY, starVX, starVY, starActive = false;
    const trailPool = [];
    const TRAIL_COUNT = 18;

    for (let i = 0; i < TRAIL_COUNT; i++) {
      const el = document.createElement('div');
      el.className = 'star-trail';
      document.body.appendChild(el);
      trailPool.push({ el, x: -999, y: -999, life: 0, maxLife: 0 });
    }

    let trailIdx = 0;

    function launchStar() {
      // always flies left-to-right at a random vertical position
      starX  = -STAR_SIZE - 10;
      starY  = 10 + Math.random() * 70;  // 10–80 vh
      starY  = starY / 100 * window.innerHeight;
      starVX = 5 + Math.random() * 4;
      starVY = (Math.random() - 0.5) * 2;
      starActive = true;
      candyStar.classList.add('active');
    }

    let starSpinAngle = 0;

    function updateStar() {
      if (!starActive) return;

      starX += starVX;
      starY += starVY;
      starSpinAngle += 4;

      candyStar.style.left      = starX + 'px';
      candyStar.style.top       = starY + 'px';
      candyStar.style.transform = `rotate(${starSpinAngle}deg)`;

      // spawn trail bubble
      const t = trailPool[trailIdx % TRAIL_COUNT];
      trailIdx++;
      t.x       = starX + STAR_SIZE / 2 - 9;
      t.y       = starY + STAR_SIZE / 2 - 9;
      t.life    = 30;
      t.maxLife = 30;
      t.el.style.background = RAINBOW[trailIdx % RAINBOW.length];
      t.el.style.boxShadow  = `0 0 8px 3px ${RAINBOW[trailIdx % RAINBOW.length]}`;

      // fade all trail bubbles
      for (const t of trailPool) {
        if (t.life > 0) {
          t.life--;
          const frac = t.life / t.maxLife;
          t.el.style.left    = t.x + 'px';
          t.el.style.top     = t.y + 'px';
          t.el.style.opacity = frac;
          t.el.style.transform = `scale(${0.4 + frac * 0.8})`;
        } else {
          t.el.style.opacity = 0;
        }
      }

      if (starX > window.innerWidth + 100) {
        starActive = false;
        candyStar.classList.remove('active');
        for (const t of trailPool) { t.life = 0; t.el.style.opacity = 0; }
        setTimeout(launchStar, 12000 + Math.random() * 18000);
      }
    }

    // first fly-by after 12 seconds
    setTimeout(launchStar, 12000);

    // --- NEDM CAT BOUNCE ---
    const cat = document.getElementById('nedm-cat');
    const CAT_SIZE = 100;
    let catX = Math.random() * (window.innerWidth  - CAT_SIZE);
    let catY = Math.random() * (window.innerHeight - CAT_SIZE);
    let catVX = (Math.random() > 0.5 ? 1 : -1) * (2.5 + Math.random() * 1.5);
    let catVY = (Math.random() > 0.5 ? 1 : -1) * (2.5 + Math.random() * 1.5);

    // Lasers
    const lasers = [];
    const MAX_LASERS = 6;

    function spawnLaser() {
      if (lasers.length >= MAX_LASERS) {
        const old = lasers.shift();
        old.el.remove();
      }

      // shoot from each eye (positions relative to cat center, tuned for photo)
      const eyeOffsets = [
        { dx: -14, dy: -6 },  // left eye
        { dx:  14, dy: -6 }   // right eye
      ];

      for (const eye of eyeOffsets) {
        const el = document.createElement('div');
        el.className = 'laser';
        document.body.appendChild(el);

        const startX = catX + CAT_SIZE / 2 + eye.dx;
        const startY = catY + CAT_SIZE / 2 + eye.dy;
        const angle  = Math.atan2(catVY, catVX) * (180 / Math.PI);
        const length = 80 + Math.random() * 60;

        el.style.left   = startX + 'px';
        el.style.top    = startY + 'px';
        el.style.width  = length + 'px';
        el.style.transform = `rotate(${angle}deg)`;

        lasers.push({ el, life: 18 });
      }

      // Flash the cat red briefly
      cat.style.filter = 'drop-shadow(0 0 8px red) brightness(1.4)';
      setTimeout(() => { cat.style.filter = ''; }, 80);
    }

    let laserTick = 0;
    function updateCat() {
      catX += catVX;
      catY += catVY;

      if (catX <= 0)                        { catX = 0;                          catVX = Math.abs(catVX); }
      if (catX >= window.innerWidth - CAT_SIZE)  { catX = window.innerWidth - CAT_SIZE;  catVX = -Math.abs(catVX); }
      if (catY <= 0)                        { catY = 0;                          catVY = Math.abs(catVY); }
      if (catY >= window.innerHeight - CAT_SIZE) { catY = window.innerHeight - CAT_SIZE; catVY = -Math.abs(catVY); }

      cat.style.left = catX + 'px';
      cat.style.top  = catY + 'px';

      // tick down laser lives
      for (let i = lasers.length - 1; i >= 0; i--) {
        lasers[i].life--;
        lasers[i].el.style.opacity = lasers[i].life / 18;
        if (lasers[i].life <= 0) {
          lasers[i].el.remove();
          lasers.splice(i, 1);
        }
      }

      laserTick++;
      if (laserTick % 40 === 0) spawnLaser();

      updateSleigh();
      updateUFO();
      updateStar();

      requestAnimationFrame(updateCat);
    }
    updateCat();
  </script>

</body>
</html>
